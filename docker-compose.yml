services:
  # Backend service (API and core logic)
  nofx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-trading
    restart: unless-stopped
    stop_grace_period: 30s  # Allow the app 30 seconds for graceful shutdown
    # NOTE: 这里曾有 `entrypoint: ["/app/data/nofx-hotfix"]`(d1cf0f4 引入),用于让
    # data 卷里的热修二进制覆盖镜像内的二进制。该文件早已不存在,而 entrypoint 覆盖
    # 会屏蔽镜像自己的 `CMD ["./nofx"]` —— 任何 `docker compose up nofx` 都会因入口
    # 文件缺失直接起不来。当前后端跑在 systemd 裸进程(ExecStart=/opt/webstack/nofx/nofx)
    # 所以一直没暴露。已移除,回落到镜像内的 CMD。
    # 若将来要恢复热修机制:先确认 /opt/webstack/nofx/data/nofx-hotfix 真实存在且可执行。
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
      - "6060:6060"  # pprof profiling
    volumes:
      - /opt/webstack/nofx/data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - /opt/webstack/nofx/.env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
      # Binance geo-block bypass: only *.binance.com is routed through the s-ui
      # mixed inbound (-> JP outbound). All other hosts stay direct.
      - BINANCE_PROXY_URL=${BINANCE_PROXY_URL:-http://s-ui:10808}
    networks:
      - nofx-network
      - webstack
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nofx-frontend
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    networks:
      - nofx-network
    extra_hosts:
      - "nofx:host-gateway"
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    driver: bridge
  # External network created by the s-ui stack; hosts the mixed:10808 proxy
  # inbound that routes Binance traffic to the JP outbound.
  webstack:
    external: true